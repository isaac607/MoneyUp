<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MoneyUp Login</title>

<style>

/* RESET */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

/* BACKGROUND */

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;

background:
linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)),
url("https://images.unsplash.com/photo-1556742049-0cfed4f6a45d");

background-size:cover;
background-position:center;
}

/* CARD */

.card{
width:400px;
height:450px;

border-radius:25px;

background: rgba(255,255,255,0.06);

backdrop-filter: blur(20px);

border:1px solid rgba(255,255,255,0.2);

box-shadow:
0 0 35px rgba(0,234,255,0.3);

color:white;
padding:30px;
}

/* LOGO */

.logo{
font-size:32px;
font-weight:bold;
text-align:center;
margin-bottom:25px;

background: linear-gradient(
90deg,
#00eaff,
#7b00ff
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

/* TITLE */

h2{
text-align:center;
margin-bottom:20px;
}

/* INPUT */

.input-box{
margin:12px 0;
}

.input-box input{
width:100%;
padding:14px;

border-radius:12px;

border:1px solid rgba(255,255,255,0.2);

background: rgba(255,255,255,0.08);

color:white;

outline:none;

transition:0.3s;
}

.input-box input:focus{
border-color:#00eaff;
box-shadow:0 0 10px #00eaff;
}

/* BUTTON */

.btn{
width:100%;
margin-top:18px;
padding:14px;

border:none;
border-radius:30px;

font-weight:bold;
cursor:pointer;

color:white;

background: linear-gradient(
90deg,
#00eaff,
#7b00ff
);

box-shadow:
0 0 15px rgba(0,234,255,0.6);

transition:0.3s;
}

.btn:hover{
transform:scale(1.05);
}

/* SWITCH */

.switch{
margin-top:15px;
font-size:14px;
color:#ccc;
text-align:center;
}

.switch a{
color:#00eaff;
font-weight:bold;
text-decoration:none;
}

</style>

</head>

<body>

<div class="card">

<div class="logo">
MoneyUp 💳
</div>

<h2>Login</h2>

<form id="loginForm">

<div class="input-box">
<input 
type="email"
name="email"
placeholder="Email"
required>
</div>

<div class="input-box">
<input 
type="password"
name="password"
placeholder="Password"
required>
</div>

<button class="btn" type="submit">
Login
</button>

<div class="switch">
Don't have an account?
<a href="signup.html">Sign Up</a>
</div>

</form>

</div>

<script>

document
.getElementById("loginForm")
.addEventListener("submit", async function(e){

    e.preventDefault();

    const email =
    document.querySelector(
    'input[name="email"]'
    ).value;

    const password =
    document.querySelector(
    'input[name="password"]'
    ).value;

    try {

        const response =
        await fetch("/login", {

            method: "POST",

            headers: {
                "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
                email,
                password
            })

        });

        const result =
        await response.text();

        alert(result);

        if (result.includes("Login successful")) {

            window.location.href =
            "home.html"; // change if needed

        }

    } catch (error) {

        alert("Server error ❌");

    }

});

</script>

</body>
</html>
