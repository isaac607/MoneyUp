<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MoneyUp | Transfer</title>

<style>

/* RESET */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

/* BACKGROUND */

body{

background:
linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)),
url("https://images.unsplash.com/photo-1556742049-0cfed4f6a45d");

background-size:cover;
background-position:center;

color:white;

}

/* NAVBAR */

.navbar{

display:flex;
justify-content:space-between;
align-items:center;

padding:20px 50px;

background: rgba(255,255,255,0.05);

backdrop-filter: blur(15px);

border-bottom:1px solid rgba(255,255,255,0.1);

}

.logo{

font-size:28px;
font-weight:bold;

background: linear-gradient(
90deg,
#00eaff,
#7b00ff
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

}

/* MAIN LAYOUT */

.container{

display:grid;

grid-template-columns: 1.2fr 1fr;

gap:30px;

padding:40px;

}

/* GLASS CARD */

.card{

padding:30px;

border-radius:20px;

background: rgba(255,255,255,0.06);

backdrop-filter: blur(20px);

border:1px solid rgba(255,255,255,0.15);

}

/* TITLE */

h2{

margin-bottom:20px;

}

/* INPUTS */

.input-box{

margin:12px 0;

}

.input-box input,
.input-box select,
.input-box textarea{

width:100%;

padding:14px;

border-radius:12px;

border:1px solid rgba(255,255,255,0.2);

background: rgba(255,255,255,0.08);

color:white;

outline:none;

}

/* SELECT COLOR FIX */

select option{
color:black;
}

/* BUTTON */

.btn{

width:100%;

margin-top:18px;

padding:14px;

border:none;

border-radius:30px;

font-weight:bold;

cursor:pointer;

color:white;

background: linear-gradient(
90deg,
#00eaff,
#7b00ff
);

box-shadow:
0 0 15px rgba(0,234,255,0.6);

transition:0.3s;

}

.btn:hover{

transform:scale(1.04);

}

/* RECENT TRANSFERS */

.transfer-item{

padding:15px;

margin-bottom:12px;

border-radius:12px;

background: rgba(255,255,255,0.05);

display:flex;

justify-content:space-between;

}

/* RESPONSIVE */

@media(max-width:900px){

.container{

grid-template-columns:1fr;

}

}

</style>

</head>

<body>

<!-- NAVBAR -->

<div class="navbar">

<div class="logo">
MoneyUp 💳
</div>

</div>

<!-- MAIN CONTENT -->

<div class="container">

<!-- TRANSFER FORM -->

<div class="card">

<h2>Transfer Money 💸</h2>

<div class="input-box">
<input type="text" placeholder="Recipient Name">
</div>

<div class="input-box">
<input type="text" placeholder="Account Number">
</div>

<div class="input-box">
<select>
<option>Select Bank</option>
<option>Access Bank</option>
<option>GTBank</option>
<option>First Bank</option>
<option>UBA</option>
<option>Zenith Bank</option>
</select>
</div>

<div class="input-box">
<input type="number" placeholder="Amount">
</div>

<div class="input-box">
<textarea rows="3"
placeholder="Description (Optional)">
</textarea>
</div>

<button class="btn">
Transfer Now
</button>

</div>

<!-- RECENT TRANSFERS -->

<div class="card">

<h2>Recent Transfers</h2>

<div class="transfer-item">
<span>John Doe</span>
<span>₦15,000</span>
</div>

<div class="transfer-item">
<span>Sarah K</span>
<span>₦8,500</span>
</div>

<div class="transfer-item">
<span>Michael T</span>
<span>₦22,000</span>
</div>

<div class="transfer-item">
<span>Electric Bill</span>
<span>₦12,300</span>
</div>

</div>

</div>

</body>
</html>
