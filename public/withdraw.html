<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MoneyUp | POS Withdraw</title>

<style>

/* RESET */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

/* BACKGROUND */
body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;

background:
linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)),
url("https://images.unsplash.com/photo-1556742049-0cfed4f6a45d");

background-size:cover;
background-position:center;

color:white;
}

/* CARD */
.card{
width:380px;
padding:25px;

border-radius:25px;

background: rgba(255,255,255,0.06);
backdrop-filter: blur(20px);

border:1px solid rgba(255,255,255,0.15);

box-shadow:0 0 30px rgba(0,234,255,0.25);

text-align:center;
}

/* TITLE */
h2{
margin-bottom:15px;
}

/* DISPLAY (LIKE CALCULATOR SCREEN) */
.display{
width:100%;
padding:15px;

border-radius:12px;

background: rgba(0,0,0,0.3);

border:1px solid rgba(255,255,255,0.2);

font-size:20px;

letter-spacing:2px;

margin-bottom:15px;

min-height:50px;
}

/* KEYPAD */
.keypad{
display:grid;
grid-template-columns: repeat(3,1fr);
gap:10px;
}

/* BUTTONS */
.key{
padding:15px;

border-radius:12px;

border:none;

cursor:pointer;

font-size:18px;

color:white;

background: rgba(255,255,255,0.08);

transition:0.2s;

}

.key:hover{
background: rgba(0,234,255,0.3);
transform:scale(1.05);
}

/* ACTION BUTTONS */
.action{
background: linear-gradient(90deg,#00eaff,#7b00ff);
}

/* STEP */
.step{
display:none;
}

.step.active{
display:block;
}

/* NEXT BUTTON */
.next{
margin-top:15px;

width:100%;

padding:12px;

border:none;

border-radius:25px;

cursor:pointer;

font-weight:bold;

color:white;

background: linear-gradient(90deg,#00eaff,#7b00ff);
}

/* BACK */
.back{
margin-top:10px;
color:#00eaff;
cursor:pointer;
font-size:13px;
}

</style>

</head>

<body>

<div class="card">

<h2>POS Withdraw 💳</h2>

<!-- STEP 1 -->
<div class="step active" id="step1">

<div class="display" id="display1">Enter Account Number</div>

<div class="keypad">

<button class="key" onclick="press('1')">1</button>
<button class="key" onclick="press('2')">2</button>
<button class="key" onclick="press('3')">3</button>

<button class="key" onclick="press('4')">4</button>
<button class="key" onclick="press('5')">5</button>
<button class="key" onclick="press('6')">6</button>

<button class="key" onclick="press('7')">7</button>
<button class="key" onclick="press('8')">8</button>
<button class="key" onclick="press('9')">9</button>

<button class="key action" onclick="backspace()">⌫</button>
<button class="key" onclick="press('0')">0</button>
<button class="key action" onclick="clearAll()">C</button>

</div>

<button class="next" onclick="nextStep()">
Next
</button>

</div>
<div class="step" id="step2">

<div class="display" id="display2">Enter Amount</div>

<div class="keypad">

<button class="key" onclick="press('1')">1</button>
<button class="key" onclick="press('2')">2</button>
<button class="key" onclick="press('3')">3</button>

<button class="key" onclick="press('4')">4</button>
<button class="key" onclick="press('5')">5</button>
<button class="key" onclick="press('6')">6</button>

<button class="key" onclick="press('7')">7</button>
<button class="key" onclick="press('8')">8</button>
<button class="key" onclick="press('9')">9</button>

<button class="key action" onclick="backspace()">⌫</button>
<button class="key" onclick="press('0')">0</button>
<button class="key action" onclick="clearAll()">C</button>

</div>

<button class="next">
Submit Withdrawal
</button>

<div class="back" onclick="goBack()">
← Back
</div>

</div>

</div>

<script>

let currentStep = 1;
let input1 = "";
let input2 = "";

function press(num){

if(currentStep === 1){
input1 += num;
document.getElementById("display1").innerText = input1;
} else {
input2 += num;
document.getElementById("display2").innerText = input2;
}

}

function backspace(){

if(currentStep === 1){
input1 = input1.slice(0,-1);
document.getElementById("display1").innerText = input1 || "Enter Account Number";
} else {
input2 = input2.slice(0,-1);
document.getElementById("display2").innerText = input2 || "Enter Amount";
}

}

function clearAll(){

if(currentStep === 1){
input1 = "";
document.getElementById("display1").innerText = "Enter Account Number";
} else {
input2 = "";
document.getElementById("display2").innerText = "Enter Amount";
}

}

function nextStep(){

if(input1.length < 5){
alert("Enter valid account number");
return;
}

document.getElementById("step1").classList.remove("active");
document.getElementById("step2").classList.add("active");

currentStep = 2;

}

function goBack(){

document.getElementById("step2").classList.remove("active");
document.getElementById("step1").classList.add("active");

currentStep = 1;

}

</script>

</body>
</html>
